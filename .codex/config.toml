approval_policy = "on-request"
approvals_reviewer = "auto_review"

default_permissions = "dotfiles-workspace-net"

[permissions.dotfiles-workspace-net]
description = "Workspace editing with unrestricted command network access."
extends = ":workspace"

[permissions.repodocs-workspace-net.filesystem]
# codex doctor の実行でsqliteを読み取りたい場合に必要
"~/.codex" = "read"

[permissions.dotfiles-workspace-net.network]
enabled = true

# Context7 MCP が通常の Linux Docker daemon に接続するために必要。
[permissions.dotfiles-workspace-net.network.unix_sockets]
"/var/run/docker.sock" = "allow"

[mcp_servers.context7]
command = "docker"
args = ["run", "-i", "--rm", "--init", "-e", "MCP_TRANSPORT=stdio", "mcp/context7:latest"]
env_vars = ["PATH"]
